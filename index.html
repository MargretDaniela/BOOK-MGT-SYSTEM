<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="./index.css">
<body>
    <nav>
        <div>
            <nav class="navbar navbar-light bg-light">
                <b><a class="navbar-brand" style="align-items: center; font-size: 250%;margin-left: 100px;">BOOK MANAGEMENT SYSTEM</a></b>
                <form class="form-inline" style="display: flex; align-items: center;">
                  <div class="search-container">
                    <i class="fa-solid fa-magnifying-glass"></i> 
                    <input class="search-input " style="margin-right: 170px;"
                  type="search" placeholder="Search by title or author" aria-label="Search">
                  </div>
                  <div>
                    <button class="btn btn-outline-success my-2 my-sm-0" 
                        style="padding: 6px 12px; font-size: 16px; white-space: nowrap; margin-right: 50px;" 
                        type="submit">
                        + Add Book
                    </button>
                </div>
            
                </form>
              </nav>
        </div>
    </nav>

    <div class="left-side" id="sidebar">
        <button class="toggle-btn" onclick="toggleSidebar()">
            <i class="fa-solid fa-bars"></i>
        </button>
      <div class="container-fluid">
        <div class="row">
            <!-- Sidebar Navigation -->
            <div >
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link active" data-bs-toggle="tab" href="#allBooks">
                            <i class="fa-solid fa-book" style="color: #087615;"></i>
                            <span class="nav-text">All Books</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" data-bs-toggle="tab" href="#favorites">
                            <i class="fa-solid fa-heart" style="color: #087615;"></i>
                            <span class="nav-text">Favourites</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" data-bs-toggle="tab" href="#unfavourite">
                            <i class="fa-solid fa-heart-crack" style="color: #087615;"></i>
                            <span class="nav-text">Unfavourite</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" data-bs-toggle="tab" href="#read">
                            <i class="fa-solid fa-check" style="color: #087615;"></i>
                            <span class="nav-text">Read</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" data-bs-toggle="tab" href="#unread">
                            <i class="fa-solid fa-battery-empty" style="color: #087615;"></i>
                            <span class="nav-text">Unread</span>
                        </a>
                    </li>
                </ul>
            </div>
    
           
        </div>
         <!-- Tab Content -->
         <div class="col-md-9 col-lg-10 p-3">
            <div class="tab-content">
                <div id="allBooks" class="tab-pane fade show active">
                </div>
                <div id="favorites" class="tab-pane fade">
                </div>
                <div id="unfavourite" class="tab-pane fade">
                </div>
                <div id="read" class="tab-pane fade">
                </div>
                <div id="unread" class="tab-pane fade">
                </div>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./index.js"></script>
</body>
</html>
