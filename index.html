<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Mgt system</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="./index.css">
</head>
<body>
    <!-- Top Navigation Bar -->
    <div class="">
        <nav class="navbar navbar-light" style="padding: 10px;  display: flex; flex-direction: column; align-items: center; text-align: center;background: white;">
            <div style="display: flex; align-items: center; justify-content: center; width: 100%; max-width: 800px; margin-top: 10px;">
                <div class="search-container" style="display: flex; align-items: center; flex-grow: 1; margin-right: 10px;">
                    <i class="fa-solid fa-magnifying-glass" style="color: rgb(138, 90, 228);"></i>
                    <input class="search-input" type="search"
                     placeholder="Search by title or author"
                     aria-label="Search"
                    onkeyup="searchBooks(this)">
                    <i class="fa-solid fa-magnifying-glass" style="color: black;"></i>
                    <input class="search-input" type="search" placeholder="Search by title or author" aria-label="Search">
                </div>

                <button class="btn btn-outline-success my-2 my-sm-0" 
                    style="padding: 6px 12px; font-size: 16px; white-space: nowrap; background-color:rgb(138, 90, 228); color:white;" 
                    type="button" 
                    data-bs-toggle="modal" 
                    data-bs-target="#exampleModalCenter">
                    + Add Book
                </button>
                
            </div>
            
        </nav>
    </div>
    <div class="middle">
        <b><a class="navbar-brand"><b>BOOK MANAGEMENT SYSTEM</b></a></b>
        <div class="content">
            <div class="book-left">
                <img src="./books/piled3.webp" alt="Book 1">
            </div>
            <div class="text-center">
                <h5>
                    <b>Keep your library neat and structured. <br>
                    <br>Quickly search, sort, and manage your collection. <br>
                    Add, remove, and update books effortlessly. <br>
                    Store complete information for each book.</b>
                </h5>
            </div>
            <div class="book-right">
                <img src="./books/piled4.jpg" alt="Book 2">
            </div>
        </div>
    </div>
    
    <div class="left-side" id="sidebar">
        <button class="toggle-btn" style="color: rgb(138, 90, 228);" onclick="toggleSidebar()">
            <i class="fa-solid fa-bars"></i>
        </button>
      <div class="container-fluid">
        <div class="row">
            <!-- Sidebar Navigation -->
            <div >
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link active" data-bs-toggle="tab" href="#allBooks">
                            <i class="fa-solid fa-book" style="color: rgb(138, 90, 228);"></i>
                            <span class="nav-text">All Books</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" data-bs-toggle="tab" href="#favorites">
                            <i class="fa-solid fa-heart" style="color:rgb(138, 90, 228);"></i>
                            <span class="nav-text">Favourites</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" data-bs-toggle="tab" href="#unfavourite">
                            <i class="fa-solid fa-heart-crack" style="color: rgb(138, 90, 228);"></i>
                            <span class="nav-text">Unfavourite</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" data-bs-toggle="tab" href="#read">
                            <i class="fa-solid fa-check" style="color: rgb(138, 90, 228);"></i>
                            <span class="nav-text">Read</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" data-bs-toggle="tab" href="#unread">
                            <i class="fa-solid fa-battery-empty" style="color: rgb(138, 90, 228);"></i>
                            <span class="nav-text">Unread</span>
                        </a>
                    </li>
                </ul>
            </div>
    
           
        </div>
    <!-- Tab Content -->
        <div class="col-md-9 col-lg-10 p-3">
            <div class="tab-content">
                <div id="allBooks" class="tab-pane fade show active">
                </div>
                <div id="favorites" class="tab-pane fade">
                </div>
                <div id="unfavourite" class="tab-pane fade">
                </div>
                <div id="read" class="tab-pane fade">
                </div>
                <div id="unread" class="tab-pane fade">
                </div>
            </div>
        </div>
    </div>
  </div>

        <!-- Button trigger modal -->
        <button type="button" class="btn btn-primary" data-toggle="modal" data-target="#exampleModalCenter">
            <!-- Launch demo modal -->
        </button>
        
       
  <!-- Modal -->
<div class="modal fade" id="exampleModalCenter" tabindex="-1" aria-labelledby="exampleModalCenterTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <!-- Modal Header -->
            <div class="modal-header">
                <h5 class="modal-title">Edit a Book</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <!-- Modal Body -->
            <div class="modal-body">
                <form class="needs-validation" novalidate>
                    <div class="row g-3">
                        <div class="col-md-12">
                            <label for="bookTitle" class="form-label">Title</label>
                            <input type="text" class="form-control" id="bookTitle" placeholder="Enter book title" required>
                        </div>

                        <div class="col-md-6">
                            <label for="bookAuthor" class="form-label">Author</label>
                            <input type="text" class="form-control" id="bookAuthor" placeholder="Author's name" required>
                        </div>

                        <div class="col-md-6">
                            <label for="bookGenre" class="form-label">Genre</label>
                            <input type="text" class="form-control" id="bookGenre" placeholder="Genre" required>
                        </div>

                        <div class="col-md-6">
                            <label for="bookStatus" class="form-label">Status</label>
                            <select class="form-control" id="bookStatus">
                                <option>Unread</option>
                                <option>Read</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label for="customFile" class="form-label">Upload Cover</label>
                            <input type="file" class="form-control" id="customFile">
                        </div>
                    </div>

                    <div class="d-flex justify-content-end mt-3">
                        <button type="button" class="btn btn-secondary me-2" data-bs-dismiss="modal">Close</button>
                        <button type="submit" class="btn btn-primary">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div id="bookList" class="row g-3">
                
            </div>
        </div>
    </div>
</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./index.js"></script>
</body>
</html>
